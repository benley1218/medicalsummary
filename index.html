<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Health Record</title>
<style>
:root{--bg:#f2f4f3;--surface:#fff;--ink:#18242b;--muted:#5d6b72;--rule:#d5dcdb;--accent:#0f5f66;--low:#b3402a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101a1e;--surface:#172429;--ink:#e4ecec;--muted:#97a9ae;--rule:#2b3d43;--accent:#6cc3c9;--low:#ff8f78;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
#gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
form{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:24px;width:100%;max-width:360px;display:grid;gap:12px}
h1{font:600 20px/1.2 Georgia,serif;margin:0}
p{margin:0;color:var(--muted);font-size:13.5px}
input{font:inherit;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:600 15px system-ui,sans-serif;padding:10px;border-radius:6px;border:0;background:var(--accent);color:var(--surface);cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--low);min-height:20px;font-size:13.5px}
</style></head>
<body><div id="gate"><form id="f" autocomplete="off"><h1>Health record</h1><p>Enter the passcode to view.</p>
<input id="pw" type="password" aria-label="Passcode" autocomplete="current-password" autofocus><div id="err" role="alert"></div><button id="go" type="submit">Unlock</button></form></div>
<script>
const Q=s=>document.querySelector(s);
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw,meta){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(meta.salt),iterations:meta.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["encrypt","decrypt"]);
}
async function decrypt(key,buf){const a=new Uint8Array(buf);return crypto.subtle.decrypt({name:"AES-GCM",iv:a.slice(0,12)},key,a.slice(12))}
async function load(key){
  const [a,d]=await Promise.all([fetch("app.enc",{cache:"no-store"}),fetch("data.enc",{cache:"no-store"})]);
  if(!a.ok||!d.ok)throw new Error("files");
  const html=new TextDecoder().decode(await decrypt(key,await a.arrayBuffer()));
  window.__DATA=JSON.parse(new TextDecoder().decode(await decrypt(key,await d.arrayBuffer())));
  window.__KEY=key;
  window.__lock=()=>{try{sessionStorage.removeItem("k")}catch(e){}location.reload()};
  const doc=new DOMParser().parseFromString(html,"text/html");
  document.title=doc.title||"Health Record";
  doc.head.querySelectorAll("link,style").forEach(n=>document.head.appendChild(n.cloneNode(true)));
  const scripts=[...doc.body.querySelectorAll("script")].map(s=>s.textContent);
  doc.body.querySelectorAll("script").forEach(s=>s.remove());
  document.body.innerHTML="";
  [...doc.body.childNodes].forEach(n=>document.body.appendChild(document.importNode(n,true)));
  document.body.setAttribute("style","");
  scripts.forEach(js=>{const s=document.createElement("script");s.textContent=js;document.body.appendChild(s)});
}
async function boot(pw,raw){
  const meta=await (await fetch("meta.json",{cache:"no-store"})).json();window.__V=encodeURIComponent(meta.salt);
  let key;
  if(raw)key=await crypto.subtle.importKey("raw",unb64(raw),"AES-GCM",true,["encrypt","decrypt"]);
  else key=await derive(pw,meta);
  await load(key);
  try{sessionStorage.setItem("k",btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw",key)))))}catch(e){}
}
Q("#f").addEventListener("submit",async e=>{
  e.preventDefault();Q("#err").textContent="";Q("#go").disabled=true;Q("#go").textContent="Unlocking…";
  try{await boot(Q("#pw").value)}
  catch(x){Q("#err").textContent=x.name==="OperationError"?"Wrong passcode.":"Could not load the record. Try again.";Q("#go").disabled=false;Q("#go").textContent="Unlock";Q("#pw").select()}
});
try{const k=sessionStorage.getItem("k");if(k)boot("",k).catch(()=>{sessionStorage.removeItem("k")})}catch(e){}
</script></body></html>
